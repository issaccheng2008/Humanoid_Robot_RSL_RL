seed: 42
device: cuda:0
num_steps_per_env: 24
max_iterations: 3000
empirical_normalization: {}
obs_groups: {}
clip_actions: null
check_for_nan: true
save_interval: 50
experiment_name: cross_stick_walk_stop_cross_v32
run_name: ''
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: model_.*.pt
class_name: OnPolicyRunner
actor:
  class_name: MLPModel
  hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: false
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 1.0
    std_type: scalar
    std_range: !!python/tuple
    - 1.0e-06
    - 1000000.0
critic:
  class_name: MLPModel
  hidden_dims:
  - 512
  - 256
  - 256
  activation: elu
  obs_normalization: false
  distribution_cfg: null
algorithm:
  class_name: tasks.manager_based.humanoid_robot_policy_rsl_rl.agents.entropy_schedule:EntropyScheduledPPO
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 5.0e-05
  schedule: fixed
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.0005
  desired_kl: 0.01
  max_grad_norm: 1.0
  optimizer: adam
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.1
  normalize_advantage_per_mini_batch: false
  share_cnn_encoders: false
  rnd_cfg: null
  symmetry_cfg:
    use_data_augmentation: true
    use_mirror_loss: true
    data_augmentation_func: tasks.manager_based.humanoid_robot_policy_rsl_rl.mdp.symmetry:compute_symmetric_states
    mirror_loss_coeff: 0.5
  training_phase: 5
  training_stage: walk_stop_cross_v32
  entropy_schedule: !!python/tuple
  - !!python/tuple
    - 0
    - 0.0005
policy: {}
